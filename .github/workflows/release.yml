name: Release Linux binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes

  build:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
          fallback: none

      - name: Verify tag matches Cargo version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$TAG" = "$expected" || {
            echo "::error::tag $TAG does not match Cargo.toml version $expected"
            exit 1
          }

      - name: Test
        run: cargo test --locked --features fleet

      - name: Build static binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cross build \
            --locked \
            --release \
            --features fleet \
            --target "$TARGET" \
            --bin mqtop-rs \
            --bin mqtop-agent

      - name: Package and checksum
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="mqtop-${TAG}-${TARGET}.tar.gz"
          mkdir -p dist/package
          cp "target/${TARGET}/release/mqtop-rs" dist/package/
          cp "target/${TARGET}/release/mqtop-agent" dist/package/
          cp LICENSE dist/package/
          tar -C dist/package -czf "dist/${asset}" mqtop-rs mqtop-agent LICENSE
          (
            cd dist
            sha256sum "$asset" > "${asset}.sha256"
          )

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="mqtop-${TAG}-${TARGET}.tar.gz"
          gh release upload "$TAG" \
            "dist/${asset}" \
            "dist/${asset}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release after all assets exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
