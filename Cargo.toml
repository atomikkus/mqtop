[package]
name = "mqtop-rs"
version = "1.0.0"
edition = "2024"
rust-version = "1.86"
description = "Ratatui job monitor compatible with mqtop ##ST protocol"
license = "MIT"
authors = ["Satya"]
default-run = "mqtop-rs"

[[bin]]
name = "mqtop-rs"
path = "src/main.rs"

[[bin]]
name = "mqtop-agent"
path = "src/bin/mqtop_agent.rs"
required-features = ["fleet"]

[features]
default = []
fleet = ["dep:tiny_http", "dep:sha2", "dep:hmac", "dep:hex"]
sqlite-history = ["dep:rusqlite"]

[dependencies]
ratatui = { version = "0.30", default-features = true }
crossterm = "0.29"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
unicode-width = "0.2"
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
tiny_http = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
